<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HeavenlyStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e3a8a 90%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-gold: #f59e0b;
      --primary-gold-hover: #d97706;
      --primary-blue: #1e3a8a;
      --accent-blue: #2563eb;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.25);

      /* Compatibility Aliases for IDE and Legacy Custom Properties */
      --primary-yellow: var(--primary-gold);
      --primary-yellow-hover: var(--primary-gold-hover);
      --deep-blue: var(--primary-blue);
      --bg-color: var(--bg-gradient);
      --text-color: var(--text-main);
      --shadow: var(--shadow-lg);
    }
    body.dark-mode {
      --bg-gradient: radial-gradient(circle at 10% 20%, #020617 0%, #0f172a 90%);
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

      /* Dark Mode Compatibility Aliases */
      --bg-color: var(--bg-gradient);
      --text-color: var(--text-main);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    .theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }

    .login-card {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 440px;
      padding: 2.75rem 2.25rem;
      border-radius: 1.5rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-logo-icon {
      width: 54px; height: 54px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #f59e0b;
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 0.85rem;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .brand h1 { color: var(--text-main); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand h1 span { color: var(--primary-gold); }
    .brand p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.35rem; }

    .form-group { margin-bottom: 1.35rem; }
    .form-group label { display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 0.45rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.04em; }
    .input-wrapper { position: relative; }
    .form-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 0.85rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      background: var(--card-bg);
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      font-weight: 800;
      font-size: 0.95rem;
      border: none;
      border-radius: 0.85rem;
      cursor: pointer;
      margin-top: 0.75rem;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      transition: all 0.25s;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(245, 158, 11, 0.45);
      color: #000;
    }

    .alert-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 1rem;
      border-radius: 0.85rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      text-align: center;
    }
    .btn-alert-signup {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.65rem;
      font-size: 0.8rem;
    }

    .footer-links { text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted); }
    .footer-links a { color: var(--accent-blue); text-decoration: none; font-weight: 700; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="document.body.classList.toggle('dark-mode')">🌙 Theme</button>

  <div class="login-card">
    <div class="brand">
      <div class="brand-logo-icon">🏠</div>
      <h1>Heavenly<span>Stay</span></h1>
      <p>Sign in to manage boardings & bookings</p>
    </div>

    <!-- Alert Box for Unregistered / Invalid Credentials -->
    <div id="alertBox" class="alert-box">
      <div id="alertMessage">You have not signed up yet! Please register before logging in.</div>
      <button class="btn-alert-signup" onclick="window.location.href='signup.html'">Go to Sign Up Page</button>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Sign In to HeavenlyStay</button>
    </form>

    <div class="footer-links">
      Don't have an account? <a href="signup.html">Create Account</a>
    </div>
  </div>

  <script>
    function handleLogin(){
        let username = $('#username').val().trim();
        let password = $('#password').val().trim();

        let obj = JSON.stringify({"userName": username, "password": password});

        $.ajax({
            url: "http://localhost:8080/v1/auth/login",
            type: 'POST',
            contentType: 'application/json',
            data: obj,
            success: function (response){
                console.log("Login response:", response);

                if (!response || response.status !== 200) {
                    let errorMsg = response.message || "Username or password incorrect, try again.";
                    $('#alertMessage').text(errorMsg);
                    $('#alertBox').show();
                    return;
                }

                const resData = response.body || response.data || response;
                const token = resData.token;
                const userId = resData.userId;
                const userName = resData.username || resData.userName || username;
                const role = resData.role || resData.userRoles || resData.userRole;

                if (!token) {
                    $('#alertMessage').text("Username or password incorrect, try again.");
                    $('#alertBox').show();
                    return;
                }

                localStorage.setItem("JWT", token);
                localStorage.setItem("userId", userId);
                localStorage.setItem("username", userName);
                localStorage.setItem("userRole", role);

                if (role === 'ADMIN') {
                  window.location.href = "admin-dashboard.html";
                }
                else {
                  window.location.href = "heavely-web-site.html";
                }
            },
            error: function (response){
                let errorMsg = (response.responseJSON && response.responseJSON.message)
                  ? response.responseJSON.message
                  : "Username or password incorrect, try again.";
                $('#alertMessage').text(errorMsg);
                $('#alertBox').show();
            }
        });
    }
  </script>
</body>
</html>
