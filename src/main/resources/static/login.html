<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HeavenlyStay</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --primary-yellow: #f59e0b;
      --primary-yellow-hover: #d97706;
      --deep-blue: #1e3a8a;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card-bg);
      border: 2px solid var(--primary-yellow);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
    }
    .login-card {
      background: var(--card-bg);
      color: var(--text-color);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
    }
    .brand { text-align: center; margin-bottom: 1.5rem; }
    .brand h1 { color: var(--primary-yellow); font-size: 2rem; font-weight: 800; }
    .brand p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
    }
    .form-input:focus { border-color: var(--primary-yellow); }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary-yellow);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: var(--primary-yellow-hover); color: #fff; }

    .alert-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .btn-alert-signup {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .footer-links a { color: var(--primary-yellow); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="document.body.classList.toggle('dark-mode')">🌙 Theme</button>

  <div class="login-card">
    <div class="brand">
      <h1>🏠 HeavenlyStay</h1>
      <p>Login to your Account</p>
    </div>

    <!-- Alert Box for Unregistered / Invalid Credentials -->
    <div id="alertBox" class="alert-box">
      <div id="alertMessage">You have not signed up yet! Please register before logging in.</div>
      <button class="btn-alert-signup" onclick="window.location.href='signup.html'">Go to Sign Up Page</button>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      
      <!-- Username & Password inputs only (No role switch button) -->
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <div class="footer-links">
      Don't have an account? <a href="signup.html">Sign Up Now</a>
    </div>
  </div>

  <script>
    function handleLogin(){
        let username = $('#username').val().trim();
        let password = $('#password').val().trim();

        let obj = JSON.stringify({"userName": username, "password": password});

        $.ajax({
            url: "http://localhost:8080/v1/auth/login",
            type: 'POST',
            contentType: 'application/json',
            data: obj,
            success: function (response){
                console.log("Login response:", response);

                if (!response || response.status !== 200) {
                    let errorMsg = response.message || "Username or password incorrect, try again.";
                    $('#alertMessage').text(errorMsg);
                    $('#alertBox').show();
                    return;
                }

                const resData = response.body || response.data || response;
                const token = resData.token;
                const userId = resData.userId;
                const userName = resData.username || resData.userName || username;
                const role = resData.role || resData.userRoles || resData.userRole;

                if (!token) {
                    $('#alertMessage').text("Username or password incorrect, try again.");
                    $('#alertBox').show();
                    return;
                }

                localStorage.setItem("JWT", token);
                localStorage.setItem("userId", userId);
                localStorage.setItem("username", userName);
                localStorage.setItem("userRole", role);

                if (role === 'ADMIN') {
                  window.location.href = "admin-dashboard.html";
                }
                else {
                  window.location.href = "heavely-web-site.html";
                }
            },
            error: function (response){
                let errorMsg = (response.responseJSON && response.responseJSON.message)
                  ? response.responseJSON.message
                  : "Username or password incorrect, try again.";
                $('#alertMessage').text(errorMsg);
                $('#alertBox').show();
            }
        });
    }
  </script>
</body>
</html>
